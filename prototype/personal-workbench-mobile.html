  <style>

    .quick-card{margin-top:10px}.quick-title{display:flex;align-items:center;gap:9px}.quick-title .module-icon{width:32px;height:32px;font-size:16px}.quick-card .choices{margin-top:13px}.quick-sport{flex:1 1 calc(50% - 4px);min-height:44px}.quick-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.quick-inputs input{min-width:0}.hiking-route-field{display:none;margin-top:12px}.hiking-route-field.visible{display:grid}.quick-weight-list{display:grid;gap:8px;margin-top:13px}.quick-weight-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quick-weight{min-height:44px}.quick-weight-base{width:100%}.quick-sport.selected,.quick-weight.selected{border-color:#9fceb9;background:var(--mint);color:var(--green);font-weight:700}.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:11px}.metric{min-width:0;padding:12px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;text-align:center}.metric strong{display:block;color:var(--green);font-size:18px}.metric small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.sport-breakdown{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.sport-breakdown span{padding:6px 8px;border-radius:6px;background:var(--mint);color:var(--green);font-size:12px;font-weight:700}

    .video-link{display:block;width:100%;min-height:46px;margin-top:16px;padding:13px;border:0;border-radius:6px;background:var(--green);color:#fff;text-align:center;text-decoration:none;font-weight:700}.summary-list{margin:12px 0 0;padding-left:20px;line-height:1.8}.learning-status{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--green);font-weight:700}.learning-status.done{border-color:#9fceb9;background:var(--mint)}
    .drawer-backdrop{position:fixed;inset:0;z-index:8;display:none;background:rgba(14,24,20,.38)}.drawer{position:fixed;top:0;bottom:0;left:0;z-index:9;display:flex;flex-direction:column;width:min(78vw,288px);padding:22px 16px;background:#fff;box-shadow:8px 0 28px rgba(20,36,29,.17);transform:translateX(-105%);transition:transform .2s ease}.drawer.open{transform:translateX(0)}.drawer-backdrop.open{display:block}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}.drawer-title{font-size:18px;font-weight:700}.drawer-nav{display:grid;gap:5px;margin-top:18px}.drawer-item{display:flex;align-items:center;gap:12px;min-height:52px;padding:7px;border-radius:7px;background:transparent;color:var(--ink);text-align:left}.drawer-item.active{background:var(--mint);color:var(--green);font-weight:700}.drawer-item .menu-icon{width:34px;height:34px}.drawer-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
    .toast{position:fixed;bottom:26px;left:50%;z-index:12;display:none;width:max-content;max-width:calc(100% - 32px);transform:translateX(-50%);padding:11px 14px;border-radius:6px;background:var(--ink);color:#fff;font-size:13px;box-shadow:var(--shadow)}.toast.show{display:block}.video-modal,.auth-modal{position:fixed;inset:0;z-index:14;display:none;align-items:flex-end;background:rgba(14,24,20,.58)}.video-modal.open,.auth-modal.open{display:flex}.video-panel,.auth-panel{width:100%;max-width:480px;max-height:92vh;margin:0 auto;padding:16px;background:var(--paper);border-radius:8px 8px 0 0}.video-modal-head,.auth-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.video-modal-head h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.video-close,.auth-close{display:grid;flex:0 0 auto;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:22px}.video-frame{display:block;width:100%;height:min(68vh,560px);border:0;border-radius:7px;background:#fff}.video-modal-tip,.auth-tip{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}.auth-panel{padding-bottom:28px}.auth-panel h2{font-size:19px}.auth-panel .primary{margin-top:18px}.auth-note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.55}@media(max-width:360px){.app{padding-right:12px;padding-left:12px}h1{font-size:24px}.hero{padding:15px}.word-mark{padding:0 9px}}
  </style>

<body>
  <main class="app">
    <section class="view active" id="homeView">
      <header class="topline"><button class="menu-trigger" type="button" data-drawer-open aria-label="打开模块菜单">☷</button><div style="margin-right:auto"><h1>今天，照顾好自己</h1></div><p class="date" id="todayDate"></p></header>
      <p class="sync" id="syncStatus">未登录 · 数据保存在本机</p>
      <section class="hero" aria-label="今日八杯水进度"><p class="hero-label">今日饮水</p><p class="water-number"><span id="waterCount">3</span> <small>/ 8 杯</small></p><div class="cup-grid" id="homeCups"></div></section>
      <section class="section"><div class="section-head"><h2>今日任务</h2></div><article class="card quick-card"><div class="quick-title"><span class="module-icon" aria-hidden="true">🏃</span><h3>运动</h3></div><div class="choices" id="quickSportChoices"></div><div class="quick-inputs"><label>时长（分钟）<input id="quickSportDuration" type="number" min="1" max="1440" step="1" placeholder="例如 60"></label><label>距离（公里）<input id="quickSportDistance" type="number" min="0" max="500" step="0.1" placeholder="例如 5.2"></label></div><label class="hiking-route-field" id="quickHikingRoute">徒步地点或路线<input id="quickHikingRouteName" type="text" maxlength="50" placeholder="例如：香山北线"></label><button class="primary" type="button" data-save-quick-sport>保存运动</button></article><article class="card quick-card"><div class="quick-title"><span class="module-icon" aria-hidden="true">⚖</span><h3>体重</h3></div><div class="quick-weight-list" id="quickWeightChoices"></div></article><article class="card quick-card"><div class="section-head"><div class="quick-title"><span class="module-icon" aria-hidden="true">✦</span><h3>护肤</h3></div><button class="more" type="button" data-open="skincare">查看记录</button></div><div class="task-list" id="taskList"><button class="task done" type="button" data-task="基础护肤"><span class="check">✓</span><span>基础护肤</span><span class="tag">已完成</span></button><button class="task done" type="button" data-task="眼膜"><span class="check">✓</span><span>眼膜</span><span class="tag">已完成</span></button><button class="task" type="button" data-task="面膜"><span class="check"></span><span>面膜</span><span class="tag">待完成</span></button></div></article></section>
    </section>
    <section class="view" id="detailView"></section>
  </main>
  <div class="drawer-backdrop" id="drawerBackdrop" data-drawer-close></div>
  <aside class="drawer" id="drawer" aria-label="模块菜单" aria-hidden="true"><div class="drawer-head"><h2 class="drawer-title">个人工作台</h2><button class="close-menu" type="button" data-drawer-close aria-label="关闭模块菜单">×</button></div><nav class="drawer-nav"><button class="drawer-item active" type="button" data-menu="home"><span class="menu-icon" aria-hidden="true">⌂</span>今天</button><button class="drawer-item" type="button" data-menu="learning"><span class="menu-icon" aria-hidden="true">🤖</span>学习</button><button class="drawer-item" type="button" data-menu="water"><span class="menu-icon" aria-hidden="true">💧</span>喝水</button><button class="drawer-item" type="button" data-menu="sport"><span class="menu-icon" aria-hidden="true">🏃</span>运动</button><button class="drawer-item" type="button" data-menu="weight"><span class="menu-icon" aria-hidden="true">⚖</span>体重</button><button class="drawer-item" type="button" data-menu="skincare"><span class="menu-icon" aria-hidden="true">✦</span>护肤</button><button class="drawer-item" type="button" data-menu="study"><span class="menu-icon" aria-hidden="true">📖</span>韩语</button><button class="drawer-item" type="button" data-menu="profile"><span class="menu-icon" aria-hidden="true">◉</span>我的</button></nav><p class="drawer-foot">移动端个人工作台</p></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="video-modal" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="videoModalTitle" aria-hidden="true"><section class="video-panel"><header class="video-modal-head"><h2 id="videoModalTitle">视频讲解</h2><button class="video-close" type="button" data-video-close aria-label="关闭视频">×</button></header><iframe class="video-frame" id="videoFrame" title="页内视频播放器" sandbox="allow-scripts allow-same-origin" allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe><p class="video-modal-tip">视频将在当前工作台内加载。若来源限制嵌入，会在当前页显示来源的提示页面。</p></section></div>
  <div class="auth-modal" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle" aria-hidden="true"><section class="auth-panel"><header class="auth-modal-head"><h2 id="authModalTitle">使用邮箱登录</h2><button class="auth-close" type="button" data-auth-close aria-label="关闭登录窗口">×</button></header><p class="auth-tip">输入邮箱后会收到一封登录邮件。点击邮件中的链接即可登录并同步记录。</p><label style="margin-top:16px">邮箱地址<input id="authEmail" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com"></label><button class="primary" id="authSend" type="button" data-auth-send>发送登录链接</button><p class="auth-note">登录链接只能在部署后的 HTTPS 地址使用。本机预览不会发送登录邮件。</p></section></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    function localDateKey(value){const date=value||new Date();return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}

    function initialSkinTasks(){return [{id:'basic-care',name:'基础护肤',icon:'🧴'},{id:'eye-mask',name:'眼膜',icon:'👁'},{id:'sheet-mask',name:'面膜',icon:'😷'},{id:'sleeping-mask',name:'冻膜',icon:'❄'},{id:'clay-mask',name:'泥膜',icon:'🪨'}]}

=!state.words[btn.dataset.word];localStorage.setItem('workbench-words',JSON.stringify(state.words));renderLessonTab(state.lessonTab);showToast(state.words[btn.dataset.word]?'已标记为生词':'已取消生词标记')}if(btn.dataset.skinTab){document.querySelectorAll('[data-skin-tab]').forEach(function(item){item.classList.toggle('active',item===btn)});renderSkin(btn.dataset.skinTab)}if(btn.dataset.lessonTab)renderLessonTab(btn.dataset.lessonTab)})
